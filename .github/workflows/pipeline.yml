
name: Pipeline MicroDetect

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura
        run: |
          test -f index.html
          test -f css/styles.css
          test -f js/chatbot.js
          test -f js/navbar.js
          test -f componentes/chatbot.html
          test -f componentes/navbar.html

      - name: Verificar páginas HTML
        run: |
          test -f views/contactanos.html
          test -f views/descargar.html
          test -f views/quienes-somos.html
          test -f views/servicios.html

      - name: Verificar sintaxis JavaScript
        run: |
          node --check js/chatbot.js
          node --check js/navbar.js

      - name: Finalizar pipeline
        run: echo "Verificaciones de MicroDetect completadas"

  desplegar:
    name: Desplegar en GitHub Pages
    needs: verificar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar sitio web
        id: deployment
        uses: actions/deploy-pages@v4
